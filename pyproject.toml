version = "0.1.0"
description = ""
authors = [
    {name = "Stanislav Kiselev",email = "ristleell@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch (>=2.7.0,<3.0.0)",
    "albumentations (==1.3.0)",
    "opencv-python-headless (>=4.11.0.86,<5.0.0.0)",
    "torchvision (>=0.22.0,<0.23.0)",
    "pycocotools (>=2.0.8,<3.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "numpy (>=2.2.5,<3.0.0)",
    "flet (>=0.27.6,<0.28.0)",
    "tqdm (>=4.67.1,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
